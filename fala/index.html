<style>

  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0f1218; --card: #181c25; --text: #eef0f6; --muted: #9aa1b6; --line: #2a303d;
      --brand-soft: #143a2f; --es-soft: #3b2a10; --bad-soft: #3d1b1b; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, system-ui, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); line-height: 1.5; -webkit-tap-highlight-color: transparent; }
  .app { max-width: 560px; margin: 0 auto; padding: 16px 16px 40px; min-height: 100vh; }
  header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
  .logo { font-weight: 800; font-size: 1.5rem; letter-spacing: -.5px; display: flex; align-items: center; gap: 8px; }
  .logo b { background: var(--brand); color: #fff; border-radius: 10px; padding: 0 8px; }
  .stats { display: flex; gap: 10px; font-weight: 700; font-size: .95rem; }
  .stats span { background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: 4px 10px; }
  h2 { font-size: 1.25rem; margin: 22px 0 10px; }
  .muted { color: var(--muted); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 18px; }
  .langs { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .lang { border: 2px solid var(--line); background: var(--card); color: var(--text); border-radius: 18px; padding: 18px 12px; font-size: 1.05rem; font-weight: 700; cursor: pointer; text-align: center; }
  .lang .flag { font-size: 2.2rem; display: block; margin-bottom: 4px; }
  .lang.on { border-color: var(--brand); background: var(--brand-soft); }
  .lang.on.es { border-color: var(--es); background: var(--es-soft); }
  .topics { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .topic { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 14px; cursor: pointer; text-align: left; color: var(--text); font: inherit; }
  .topic .ico { font-size: 1.8rem; }
  .topic .name { font-weight: 700; display: block; margin-top: 4px; }
  .topic .bar { height: 6px; background: var(--line); border-radius: 9px; margin-top: 10px; overflow: hidden; }
  .topic .bar i { display: block; height: 100%; background: var(--brand); width: 0; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 0; border-radius: 14px; padding: 14px 18px; font: inherit; font-weight: 700; cursor: pointer; background: var(--brand); color: #fff; }
  .btn:active { transform: scale(.98); }
  .btn.ghost { background: transparent; color: var(--text); border: 1px solid var(--line); }
  .btn.wide { width: 100%; }
  .btn:disabled { opacity: .5; cursor: default; }
  .back { background: none; border: 0; color: var(--muted); font: inherit; font-weight: 600; cursor: pointer; padding: 6px 0; }
  .progress { height: 10px; background: var(--line); border-radius: 9px; overflow: hidden; margin: 6px 0 18px; }
  .progress i { display: block; height: 100%; background: var(--brand); transition: width .3s; }
  .phrase { font-size: 1.55rem; font-weight: 800; margin: 6px 0 4px; line-height: 1.3; }
  .phrase .w { border-radius: 6px; padding: 0 2px; }
  .phrase .w.ok { background: var(--brand-soft); color: var(--brand-dark); }
  .phrase .w.miss { background: var(--bad-soft); color: var(--bad); }
  .trans { color: var(--muted); font-size: 1.05rem; }
  .row { display: flex; gap: 10px; margin-top: 16px; flex-wrap: wrap; }
  .row .btn { flex: 1; }
  .mic { width: 92px; height: 92px; border-radius: 50%; font-size: 2.4rem; margin: 22px auto 8px; display: flex; padding: 0; }
  .mic.rec { background: var(--bad); animation: pulse 1.1s infinite; }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(224,49,49,.5); } 100% { box-shadow: 0 0 0 22px rgba(224,49,49,0); } }
  .center { text-align: center; }
  .heard { margin-top: 10px; font-style: italic; color: var(--muted); min-height: 1.5em; }
  .score { font-size: 2.6rem; font-weight: 900; }
  .score.good { color: var(--brand); } .score.mid { color: var(--es); } .score.bad { color: var(--bad); }
  .feedback { text-align: center; margin-top: 10px; }
  .typebox { display: flex; gap: 8px; margin-top: 12px; }
  .typebox input { flex: 1; border: 1px solid var(--line); background: var(--bg); color: var(--text); border-radius: 12px; padding: 12px; font: inherit; }
  .chat { display: flex; flex-direction: column; gap: 10px; margin-bottom: 14px; }
  .msg { max-width: 85%; padding: 10px 14px; border-radius: 16px; }
  .msg small { display: block; color: var(--muted); font-size: .85rem; margin-top: 2px; }
  .msg.bot { background: var(--card); border: 1px solid var(--line); align-self: flex-start; border-bottom-left-radius: 4px; }
  .msg.me { background: var(--brand); color: #fff; align-self: flex-end; border-bottom-right-radius: 4px; }
  .msg.me small { color: #d9fff1; }
  .hints { display: flex; flex-direction: column; gap: 8px; }
  .hint { background: var(--card); border: 1px dashed var(--line); border-radius: 12px; padding: 10px 12px; text-align: left; color: var(--text); font: inherit; cursor: pointer; }
  .hint small { display: block; color: var(--muted); }
  .note { background: var(--es-soft); border-radius: 12px; padding: 10px 12px; font-size: .92rem; margin-top: 14px; }
  .modes { display: grid; gap: 12px; }
  .mode { display: flex; gap: 14px; align-items: center; background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 16px; cursor: pointer; text-align: left; color: var(--text); font: inherit; }
  .mode .ico { font-size: 2rem; }
  .mode b { display: block; }
  footer { margin-top: 36px; text-align: center; color: var(--muted); font-size: .85rem; }
  .hidden { display: none !important; }

const LANG = {
  en: { name: "Inglês", flag: "🇺🇸", voice: "en-US" },
  es: { name: "Espanhol", flag: "🇪🇸", voice: "es-ES" }
};

/* ===================== ESTADO SALVO ===================== */
const store = {
  get() { try { return JSON.parse(localStorage.getItem("falaja") || "{}"); } catch { return {}; } },
  set(v) { try { localStorage.setItem("falaja", JSON.stringify(v)); } catch {} }
};
let S = Object.assign({ lang: "en", xp: 0, streak: 0, lastDay: "", done: {} }, store.get());
const save = () => store.set(S);

function today() { const d = new Date(); return d.getFullYear() + "-" + (d.getMonth() + 1) + "-" + d.getDate(); }
function addXP(n) {
  S.xp += n;
  const t = today();
  if (S.lastDay !== t) {
    const y = new Date(Date.now() - 864e5);
    const yest = y.getFullYear() + "-" + (y.getMonth() + 1) + "-" + y.getDate();
    S.streak = S.lastDay === yest ? S.streak + 1 : 1;
    S.lastDay = t;
  }
  save();
}

/* ===================== VOZ ===================== */
const Rec = window.SpeechRecognition || window.webkitSpeechRecognition;
const canListen = !!Rec;

function speak(text, slow) {
  if (!("speechSynthesis" in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = LANG[S.lang].voice;
  u.rate = slow ? 0.6 : 0.95;
  const v = speechSynthesis.getVoices().find(v => v.lang.replace("_", "-").startsWith(S.lang));
  if (v) u.voice = v;
  speechSynthesis.speak(u);
}
if ("speechSynthesis" in window) speechSynthesis.onvoiceschanged = () => {};

let recNow = null;
function listen(onResult, onEnd) {
  if (!canListen) return;
  if (recNow) { recNow.stop(); return; }
  const r = new Rec();
  r.lang = LANG[S.lang].voice;
  r.interimResults = false;
  r.maxAlternatives = 3;
  r.onresult = e => {
    const alts = Array.from(e.results[0]).map(a => a.transcript);
    onResult(alts);
  };
  r.onerror = e => { if (e.error === "not-allowed") alert("Permita o uso do microfone para praticar a fala."); };
  r.onend = () => { recNow = null; onEnd && onEnd(); };
  recNow = r;
  r.start();
}

/* ===================== COMPARAÇÃO ===================== */
function norm(s) {
  return s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "")
    .replace(/[^a-z0-9ñ' ]/g, " ").replace(/\s+/g, " ").trim();
}
function grade(target, said) {
  const tw = norm(target).split(" ");
  const sw = norm(said).split(" ");
  const pool = sw.slice();
  const marks = tw.map(w => { const i = pool.indexOf(w); if (i >= 0) { pool.splice(i, 1); return true; } return false; });
  const hit = marks.filter(Boolean).length;
  const extra = Math.max(0, sw.length - tw.length);
  const score = Math.max(0, Math.round(100 * hit / tw.length - extra * 5));
  return { score, marks };
}
function bestGrade(target, alts) {
  return alts.map(a => ({ said: a, ...grade(target, a) })).sort((a, b) => b.score - a.score)[0];
}

    </div>`;
  $app.querySelector(".back").onclick = home;
  $app.querySelectorAll(".topic").forEach(b => b.onclick = () => lesson(TOPICS.find(t => t.id === b.dataset.id), 0));
}

function lesson(topic, i) {
  const p = topic.phrases[i];
  const target = p[S.lang];
  $app.innerHTML = header() + `
    <button class="back">← ${topic.name}</button>
    <div class="progress"><i style="width:${100 * i / topic.phrases.length}%"></i></div>
    <div class="card">
      <div class="muted">Fale esta frase em ${LANG[S.lang].name.toLowerCase()}:</div>
      <div class="phrase" id="phrase">${esc(target)}</div>
      <div class="trans">${esc(p.pt)}</div>
      <div class="row">
        <button class="btn ghost" id="play">🔊 Ouvir</button>
        <button class="btn ghost" id="slow">🐢 Devagar</button>
      </div>
      <div class="center">
        ${canListen ? `<button class="btn mic" id="mic" aria-label="Falar">🎤</button><div class="muted" id="micTip">Toque e fale</div>` :
          `<div class="typebox"><input id="typed" placeholder="Digite a frase aqui"><button class="btn" id="check">OK</button></div>`}
        <div class="heard" id="heard"></div>
        <div class="feedback" id="fb"></div>
      </div>
    </div>
    <div class="row">
      <button class="btn ghost" id="skip">Pular</button>
      <button class="btn" id="next" disabled>Próxima →</button>
    </div>`;
  $app.querySelector(".back").onclick = topics;
  $app.querySelector("#play").onclick = () => speak(target);
  $app.querySelector("#slow").onclick = () => speak(target, true);
  const next = () => {
    if (i + 1 < topic.phrases.length) lesson(topic, i + 1);
    else finished(topic);
  };
  $app.querySelector("#skip").onclick = next;
  $app.querySelector("#next").onclick = next;
  let rewarded = false;

  const judge = alts => {
    const g = bestGrade(target, alts);
    const words = target.split(" ");
    $app.querySelector("#phrase").innerHTML = words.map((w, k) => `<span class="w ${g.marks[k] ? "ok" : "miss"}">${esc(w)}</span>`).join(" ");
    $app.querySelector("#heard").textContent = `Você disse: "${g.said}"`;
    const cls = g.score >= 80 ? "good" : g.score >= 50 ? "mid" : "bad";
    const msg = g.score >= 80 ? "Mandou bem! 🎉" : g.score >= 50 ? "Quase lá! Tente de novo as palavras em vermelho." : "Ouça de novo e tente mais uma vez 💪";
    $app.querySelector("#fb").innerHTML = `<div class="score ${cls}">${g.score}%</div><div>${msg}</div>`;
    if (g.score >= 50) {
      $app.querySelector("#next").disabled = false;
      if (!rewarded) {
        rewarded = true;
        addXP(g.score >= 80 ? 10 : 5);
        const key = S.lang + ":" + topic.id;
        S.done[key] = Math.max(S.done[key] || 0, i + 1); save();
        $app.querySelector(".stats").outerHTML = `<div class="stats"><span>🔥 ${S.streak}</span><span>⭐ ${S.xp}</span></div>`;
      }
    }
  };

  if (canListen) {
    const mic = $app.querySelector("#mic");
    mic.onclick = () => {
      speechSynthesis && speechSynthesis.cancel();
      mic.classList.add("rec"); $app.querySelector("#micTip").textContent = "Ouvindo… fale agora";
      listen(judge, () => { mic.classList.remove("rec"); $app.querySelector("#micTip").textContent = "Toque e fale"; });
    };
  } else {
    const go = () => judge([$app.querySelector("#typed").value]);
    $app.querySelector("#check").onclick = go;
    $app.querySelector("#typed").onkeydown = e => { if (e.key === "Enter") go(); };
  }
  setTimeout(() => speak(target), 300);
}

function finished(topic) {
  addXP(20);
  $app.innerHTML = header() + `
    <div class="card center" style="margin-top:30px">
      <div style="font-size:4rem">🏆</div>
      <h2>Tema "${topic.name}" concluído!</h2>
      <p class="muted">Você ganhou +20 pontos de bônus. Volte amanhã para manter a sua sequência 🔥</p>
      <div class="row"><button class="btn ghost" id="again">Repetir</button><button class="btn" id="more">Outros temas</button></div>
    </div>`;
  $app.querySelector("#again").onclick = () => lesson(topic, 0);
  $app.querySelector("#more").onclick = topics;
}

function dialogs() {
  const list = DIALOGS[S.lang];
  $app.innerHTML = header() + `
    <button class="back">← Voltar</button>
    <h2>${LANG[S.lang].flag} Conversas guiadas</h2>
    <div class="modes">${list.map((d, k) => `<button class="mode" data-k="${k}"><span class="ico">💬</span><span><b>${d.title}</b><span class="muted">${d.lines.length} falas</span></span></button>`).join("")}</div>`;
  $app.querySelector(".back").onclick = home;
  $app.querySelectorAll("[data-k]").forEach(b => b.onclick = () => chat(list[+b.dataset.k]));
}

function chat(d) {
  let step = 0;
  $app.innerHTML = header() + `
    <button class="back">← Conversas</button>
    <h2>${d.title}</h2>
    <div class="chat" id="chat"></div>
    <div id="turn"></div>`;
  $app.querySelector(".back").onclick = dialogs;
  const $chat = $app.querySelector("#chat"), $turn = $app.querySelector("#turn");
  const add = (cls, text, sub) => {
    const m = document.createElement("div"); m.className = "msg " + cls;
    m.innerHTML = esc(text) + (sub ? `<small>${esc(sub)}</small>` : "");
    $chat.appendChild(m); m.scrollIntoView({ behavior: "smooth", block: "end" });
  };

  const botTurn = () => {
    const ln = d.lines[step];
    add("bot", ln.bot, ln.pt);
    speak(ln.bot);
    $turn.innerHTML = `
      <div class="muted" style="margin-bottom:8px">Responda falando uma destas frases (toque para ouvir):</div>
      <div class="hints">${ln.ans.map((a, k) => `<button class="hint" data-k="${k}">🔊 ${esc(a[0])}<small>${esc(a[1])}</small></button>`).join("")}</div>
      <div class="center">
        ${canListen ? `<button class="btn mic" id="mic">🎤</button><div class="muted" id="micTip">Toque e responda</div>` :
          `<div class="typebox"><input id="typed" placeholder="Digite a sua resposta"><button class="btn" id="check">OK</button></div>`}
        <div class="heard" id="heard"></div>
      </div>
      <div class="center"><button class="back" id="replay">🔁 Ouvir a pergunta de novo</button></div>`;
    $turn.querySelectorAll(".hint").forEach(h => h.onclick = () => speak(ln.ans[+h.dataset.k][0]));
    $turn.querySelector("#replay").onclick = () => speak(ln.bot);

    const answer = alts => {
      const best = ln.ans.map(a => ({ a, ...bestGrade(a[0], alts) })).sort((x, y) => y.score - x.score)[0];
      if (best.score >= 60) {
        add("me", best.said, `${best.score}% ✔`);
        addXP(best.score >= 80 ? 10 : 5);
        step++;
        if (step < d.lines.length) setTimeout(botTurn, 700);
        else setTimeout(() => {
          addXP(20);
          $turn.innerHTML = `<div class="card center"><div style="font-size:3rem">🎉</div><b>Conversa concluída!</b><p class="muted">+20 pontos de bônus.</p>
            <div class="row"><button class="btn ghost" id="again">Repetir</button><button class="btn" id="more">Outras conversas</button></div></div>`;
          $turn.querySelector("#again").onclick = () => chat(d);
          $turn.querySelector("#more").onclick = dialogs;
        }, 700);
      } else {
        $turn.querySelector("#heard").innerHTML = `Entendi: "${esc(best.said)}" — ainda não deu (${best.score}%). Ouça a frase e tente de novo 💪`;
      }
    };

    if (canListen) {
      const mic = $turn.querySelector("#mic");
      mic.onclick = () => {
        speechSynthesis && speechSynthesis.cancel();
        mic.classList.add("rec"); $turn.querySelector("#micTip").textContent = "Ouvindo…";
        listen(answer, () => { mic.classList.remove("rec"); const t = $turn.querySelector("#micTip"); if (t) t.textContent = "Toque e responda"; });
      };
    } else {
      const go = () => answer([$turn.querySelector("#typed").value]);
      $turn.querySelector("#check").onclick = go;
      $turn.querySelector("#typed").onkeydown = e => { if (e.key === "Enter") go(); };
    }
  };
  botTurn();
}

home();
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
</body>
</html>
